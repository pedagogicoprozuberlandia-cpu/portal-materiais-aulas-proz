<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Aulas PROZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{--azul:#593493;--teal:#593493;--teal-claro:#efe8f8;--laranja:#ff7f00;--laranja-esc:#e06a00;--fundo:#f3f6f8;--linha:#dbe3ea;--texto:#1c2833;--suave:#5d6d7c;--erro:#b42318;--alerta-bg:#fdf3e1;--raio:12px}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--fundo);color:var(--texto);font:16px/1.55 "Source Sans 3",system-ui,sans-serif}
  h1,h2,h3{font-family:Bitter,Georgia,serif;line-height:1.25;margin:0;text-wrap:balance}
  button,input,select{font:inherit}
  .wrap{max-width:1050px;margin:0 auto;padding-inline:16px}
  .topo-grad{background:linear-gradient(115deg,#4a2a80 0%,#593493 38%,#8a3f86 68%,#d8622a 90%,#ff7f00 100%);color:#fff}
  header{background:transparent;color:#fff}
  header .wrap{display:flex;align-items:center;gap:14px;padding-block:16px;flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:12px;cursor:pointer;flex:1}
  .logo{width:44px;height:44px;border-radius:10px;background:var(--teal);display:grid;place-items:center;flex:none}
  header h1{font-size:1.3rem}header small{display:block;opacity:.75;font-size:.88rem}
  .navbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.9rem}
  .hero{background:transparent;color:#fff;padding-block:4px 60px}
  .hero h2,.hero p{text-shadow:0 1px 2px rgba(40,15,70,.35)}
  .hero h2{font-size:clamp(1.4rem,4vw,2rem)}.hero p{opacity:.85;margin:6px 0 0;max-width:62ch}
  main{padding-block:0 50px}
  .sobe{margin-top:-44px}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:18px;display:flex;flex-direction:column;gap:9px;text-decoration:none;color:inherit;box-shadow:0 4px 14px rgba(60,30,110,.07);transition:border-color .15s,transform .15s}
  .card.clic{cursor:pointer}.card.clic:hover,a.card:hover{border-color:var(--teal);transform:translateY(-2px)}
  .sig{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700}
  .card h3{font-size:1.1rem}.desc{color:var(--suave);font-size:.92rem}
  .cta{margin-top:auto;display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#fff;border-radius:8px;padding:8px 14px;font-weight:700;align-self:flex-start;text-decoration:none;font-size:.95rem}
  .tag{font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--teal-claro);color:#45237a;font-weight:600;display:inline-block}
  .tag.cinza{background:#eef1f4;color:var(--suave)}
  .off{opacity:.65;box-shadow:none}
  .painel{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:18px;box-shadow:0 4px 14px rgba(60,30,110,.07)}
  .barra{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 14px}
  .barra select,.barra input{flex:1;min-width:180px}
  input,select{width:100%;padding:8px 10px;border:1px solid var(--linha);border-radius:8px;background:#fff;color:var(--texto)}
  input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
  label{display:block;font-weight:600;font-size:.88rem;margin-bottom:3px}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:#fff;color:var(--texto);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap}
  .btn:hover{border-color:var(--teal)}.btn.prim{background:var(--teal);border-color:var(--teal);color:#fff}.btn.prim:hover{background:#45237a}
  .btn.perigo{color:var(--erro)}.btn.perigo.conf{background:var(--erro);color:#fff;border-color:var(--erro)}
  .btn.peq{padding:5px 10px;font-size:.87rem}.btn:disabled{opacity:.6;cursor:wait}
  .vazio{text-align:center;color:var(--suave);padding:34px 16px;border:1px dashed var(--linha);border-radius:var(--raio);background:#fff;grid-column:1/-1}
  .aviso{background:var(--alerta-bg);border:1px solid #f0d49b;color:#6b4a10;padding:12px 16px;border-radius:10px;margin:16px 0}
  .dica{color:var(--suave);font-size:.86rem;font-weight:400}
  /* tabela coordenação */
  .tab-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:760px}
  th{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);padding:8px 6px;border-bottom:2px solid var(--linha)}
  td{padding:6px;border-bottom:1px solid var(--linha);vertical-align:middle}
  td input{padding:6px 8px}
  tr.mudou td{background:#fffbea}
  .abas{display:flex;gap:6px;border-bottom:1px solid var(--linha);margin-bottom:16px;flex-wrap:wrap}
  .abas button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--suave);font-weight:600}
  .abas button.on{color:var(--azul);border-bottom-color:var(--teal)}
  .form-lin{display:grid;grid-template-columns:2fr 1.4fr 1fr 2fr auto;gap:8px;align-items:end}
  @media (max-width:760px){.form-lin{grid-template-columns:1fr 1fr}}
  .troca{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
  @media (max-width:600px){.troca{grid-template-columns:1fr}}
  .cor{width:44px;padding:2px;height:36px}
  .auth{max-width:400px;margin:30px auto}
  .acoes{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
  .acoes .cta{margin-top:0}
  .cta.sec{background:#fff!important;color:var(--texto);border:2px solid var(--linha);cursor:pointer;font-family:inherit;font-size:.95rem}
  .ajudaBtn{background:var(--laranja);color:#fff;box-shadow:0 3px 0 #b85600;border:0;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;margin-top:14px;font-size:1rem}
  .modal{position:fixed;inset:0;background:rgba(10,25,40,.6);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;z-index:20;overflow-y:auto}
  .caixa{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:22px;position:relative}
  .caixa h3{font-size:1.3rem;margin-bottom:6px;padding-right:40px}
  .fechar{position:absolute;right:14px;top:12px;border:0;background:#eef1f4;border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer}
  .passos3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
  @media (max-width:640px){.passos3{grid-template-columns:1fr}}
  .passo3{text-align:center}
  .passo3 .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:1.1rem;margin-bottom:6px}
  .passo3 p{margin:8px 0 0;font-weight:600;font-size:1.05rem}
  .cel{width:150px;height:250px;margin:0 auto;border:7px solid #1c2833;border-radius:22px;background:#f3f6f8;overflow:hidden;position:relative;text-align:left}
  .cel .tp{background:var(--azul);height:34px;color:#fff;font-size:10px;font-weight:700;padding:10px 8px}
  .cel .it{background:#fff;margin:6px;border-radius:6px;padding:7px;font-size:10px;font-weight:600;border:1px solid var(--linha);display:flex;gap:5px;align-items:center}
  .cel .it.hl{border:2px solid var(--teal);background:var(--teal-claro)}
  .cel .sq{width:14px;height:14px;border-radius:3px;flex:none}
  .cel .dedo{position:absolute;font-size:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  .guia-abas{display:flex;gap:8px;margin:12px 0}
  .guia-abas button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--linha);background:#fff;font-weight:700;cursor:pointer}
  .guia-abas button.on{border-color:var(--teal);background:var(--teal-claro);color:#45237a}
  .lista-guia{font-size:1.08rem;line-height:1.7;padding-left:22px}
  .lista-guia b{color:#45237a}
  .dica-box{background:var(--alerta-bg);border-radius:10px;padding:10px 14px;margin-top:10px}
  .qr-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .qr-card{border:1px solid var(--linha);border-radius:12px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
  .qr-card .qr{width:150px;height:150px}
  .qr-card .qr img,.qr-card .qr canvas{width:150px!important;height:150px!important}
  .drop{border:2px dashed #b9a6d9;border-radius:12px;padding:26px;text-align:center;background:#faf7fe;cursor:pointer}
  .drop.over{background:var(--teal-claro);border-color:var(--teal)}
  .st{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .st.nova{background:#e5f5ec;color:#1e7d4f}.st.atu{background:#e8effa;color:#2d5fa0}.st.err{background:#fde8e6;color:#b42318}.st.igual{background:#eef1f4;color:#5d6d7c}
  .aulas{display:flex;flex-direction:column;gap:10px}
  .aula{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(60,30,110,.05)}
  .aula .ic{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.72rem;flex:none}
  .aula .nm{flex:1;min-width:180px;font-weight:700;font-size:1.02rem;word-break:break-word}
  .aula .nm small{display:block;font-weight:400;color:var(--suave);font-size:.82rem}
  .aula .bts{display:flex;gap:8px;flex-wrap:wrap}
  .aula .cta{margin-top:0;padding:9px 16px;font-size:1rem}
  .aula.pasta{cursor:pointer}.aula.pasta:hover{border-color:var(--teal)}
  .carregando{padding:30px;text-align:center;color:var(--suave)}
  .turnos{margin-top:14px;background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px;box-shadow:0 4px 14px rgba(60,30,110,.07)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{border:2px solid var(--linha);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:1rem;color:var(--texto)}
  .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .card .turnoTag{font-size:.85rem;padding:3px 10px;border-radius:999px;background:var(--laranja);color:#fff;font-weight:700;display:inline-block}
  tr.oculta td{background:#f6f5f8}
  tr.oculta td input:not([type=checkbox]){color:#8a8f98}
  .vis{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;white-space:nowrap;cursor:pointer}
  .aula.oc{background:#f6f5f8}.aula.oc .nm{color:#8a8f98}
  .caixa .aula{box-shadow:none;padding:8px 10px}.caixa .aula .ic{width:34px;height:34px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--azul);color:#fff;padding:10px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:9;max-width:calc(100% - 32px)}
  #toast.erro{background:var(--erro)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
/* ============ CONFIGURAÇÃO (Supabase > Project Settings > API) ============ */
const SUPABASE_URL = "https://qipchmwlsyzrbszsxwdo.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpcGNobXdsc3l6cmJzenN4d2RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNTU1MTQsImV4cCI6MjEwNTkzMTUxNH0.CT8mHhpTW0RGT9EFTWVduyU7nH1u8Lb2YBAJJmxkMlE";
// Chave do Google (Drive API) para listar as aulas dentro das pastas.
// Deixe "" para o portal só abrir a pasta do Google Drive.
const GOOGLE_API_KEY = "AIzaSyCy8eVR-8llTIqv_ZaB3Yn3_cpvOnlz4ns";
/* ========================================================================== */

const configurado = !SUPABASE_URL.startsWith("COLE_AQUI");
const sb = configurado ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let _turnoSalvo=""; try{ _turnoSalvo=localStorage.getItem("proz_turno")||""; }catch{}
const _pref=(()=>{ try{ return JSON.parse(localStorage.getItem("proz_coord")||"{}"); }catch{ return {}; } })();
const S = { aba:_pref.aba||"disc", filtroCurso:_pref.curso||"", turno:_turnoSalvo, cursos:[], disc:[], tela:"home", curso:null, sessao:null };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const urlOk = u => { try { return new URL(u).protocol==="https:"; } catch { return false; } };
let tT; function toast(m,e){const t=$("toast");t.textContent=m;t.className=e?"erro":"";t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,3500)}
function erroMsg(e){const m=e?.message||String(e);if(/Invalid login/i.test(m))return"E-mail ou senha incorretos.";if(/row-level/i.test(m))return"Sem permissão. Entre com o login da coordenação.";return m}
const ordenar = arr => arr.sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt-BR") || (a.turma||"").localeCompare(b.turma||"","pt-BR"));

async function carregar(){
  if(!configurado){ S.cursos=[]; S.disc=[]; return; }
  const [c,d] = await Promise.all([
    sb.from("cursos").select("*").order("ordem").order("nome"),
    sb.from("disciplinas").select("*")
  ]);
  if(c.error||d.error){ toast("Não consegui carregar os dados.",true); return; }
  S.cursos=c.data; S.disc=ordenar(d.data);
}
const cursoDe = id => S.cursos.find(c=>c.id===id);

/* ======================= ALUNO ======================= */
function setHash(h){ try{ history.replaceState(null,"",h?("#"+h):location.pathname+location.search); }catch{} }
function irHome(){ S.tela="home"; S.curso=null; setHash(""); render(); window.scrollTo({top:0}); }
function abrirCurso(id){ S.tela="curso"; S.curso=id; setHash("c-"+id); render(); window.scrollTo({top:0}); }
function abrirDisc(id){ const d=S.disc.find(x=>x.id===id); if(!d) return; S.tela="disc"; S.curso=d.curso_id; S.discAtual=id; S.pilha=[]; setHash("d-"+id); render(); window.scrollTo({top:0}); }
function irCoord(){ S.tela="coord"; setHash("coordenacao"); render(); window.scrollTo({top:0}); }
const LS={ get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{ return d; } },
           set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} },
           del(k){ try{ localStorage.removeItem(k); }catch{} } };
function temEdicoesPendentes(){ const e=LS.get("proz_edicoes",{}); return Object.keys(e).length>0; }
window.addEventListener("beforeunload",e=>{ if(S.tela==="coord" && temEdicoesPendentes()){ e.preventDefault(); e.returnValue=""; } });

function render(){
  $("navCoord").textContent = S.tela==="coord" ? "← Ver portal" : "Coordenação";
  $("navCoord").onclick = S.tela==="coord" ? irHome : irCoord;
  if(S.tela==="coord") return renderCoord();
  if(S.tela==="curso") return renderCurso();
  if(S.tela==="disc") return renderDisc();
  renderHome();
}

function renderHome(){
  $("hero").innerHTML=`<h2>Materiais de aula</h2><p>Escolha o seu curso para ver as disciplinas, os professores e as aulas.</p><button class="ajudaBtn" onclick="ajuda()">❓ Precisa de ajuda? Veja como usar</button>`;
  if(!configurado){ $("app").innerHTML=`<div class="painel"><b>Falta conectar o Supabase.</b> Cole a URL e a chave no início do código.</div>`; return; }
  const cursos=S.cursos.filter(c=>c.ativo);
  $("app").innerHTML = `<div class="grade">${cursos.map(c=>{
    const n=S.disc.filter(d=>d.curso_id===c.id&&d.ativo).length;
    return `<div class="card clic" tabindex="0" onclick="abrirCurso('${c.id}')" onkeydown="if(event.key==='Enter')abrirCurso('${c.id}')">
      <div class="sig" style="background:${esc(c.cor)}">${esc(c.sigla)}</div>
      <h3>${esc(c.nome)}</h3>
      <div><span class="tag${n?"":" cinza"}">${n} disciplina${n===1?"":"s"}</span></div>
      <span class="cta" style="background:${esc(c.cor)}">Ver disciplinas →</span></div>`;}).join("") || `<div class="vazio">Nenhum curso cadastrado.</div>`}</div>`;
}

function renderCurso(){
  const c=cursoDe(S.curso); if(!c) return irHome();
  const lista=S.disc.filter(d=>d.curso_id===c.id&&d.ativo);
  const turmas=[...new Set(lista.map(d=>d.turma).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt-BR"));

    $("gD").innerHTML = f.length ? f.map(d=>{
      const link=urlOk(d.link)?d.link:(urlOk(c.link)?c.link:null);
      const corpo=`${d.turma?`<div><span class="turnoTag">🕘 ${esc(d.turma)}</span></div>`:""}<h3>${esc(d.nome)}</h3>
        <div class="desc">${d.professor?`Prof. ${esc(d.professor)}`:"Professor a definir"}</div>`;

                  : `<div class="card off">${corpo}<span class="desc" style="margin-top:auto">Materiais em breve</span></div>`;
    }).join("") : `<div class="vazio">${lista.length?"Nada encontrado.":"Nenhuma disciplina cadastrada neste curso ainda."}</div>`;
  };
  $("bD").oninput=pinta;
  document.querySelectorAll("#chips .chip").forEach(b=>b.onclick=()=>{ S.turno=b.dataset.t; try{localStorage.setItem("proz_turno",S.turno)}catch{} pinta(); });
  pinta();
}

/* ======================= AULAS DA DISCIPLINA (Google Drive) ======================= */
function pastaId(url){ const m=String(url||"").match(/\/folders\/([\w-]{10,})/) || String(url||"").match(/[?&]id=([\w-]{10,})/); return m?m[1]:null; }
const TIPOS = {
  "application/pdf":["PDF","#c0392b"],
  "application/vnd.google-apps.presentation":["SLD","#e0a800"],
  "application/vnd.openxmlformats-officedocument.presentationml.presentation":["PPT","#d35400"],
  "application/vnd.ms-powerpoint":["PPT","#d35400"],
  "application/vnd.google-apps.document":["DOC","#2d6cb5"],
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document":["DOC","#2d6cb5"],
  "application/msword":["DOC","#2d6cb5"],
  "application/vnd.google-apps.spreadsheet":["PLAN","#1b8a6b"],
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":["PLAN","#1b8a6b"],
};
function tipoDe(f){ if(TIPOS[f.mimeType]) return TIPOS[f.mimeType];
  if(f.mimeType.startsWith("image/")) return ["IMG","#8e44ad"]; if(f.mimeType.startsWith("video/")) return ["VÍDEO","#16a085"];
  if(f.mimeType.startsWith("audio/")) return ["ÁUDIO","#16a085"]; return ["ARQ","#5d6d7c"]; }
function linkAbrir(f){ return f.webViewLink || `https://drive.google.com/file/d/${f.id}/view`; }
function linkBaixar(f){
  const t=f.mimeType;
  if(t==="application/vnd.google-apps.presentation") return `https://docs.google.com/presentation/d/${f.id}/export/pdf`;
  if(t==="application/vnd.google-apps.document") return `https://docs.google.com/document/d/${f.id}/export?format=pdf`;
  if(t==="application/vnd.google-apps.spreadsheet") return `https://docs.google.com/spreadsheets/d/${f.id}/export?format=xlsx`;
  if(t.startsWith("application/vnd.google-apps.")) return null;
  return `https://drive.google.com/uc?export=download&id=${f.id}`;
}
function tamanho(b){ b=+b; if(!b) return ""; return b>1048576?(b/1048576).toFixed(1).replace(".",",")+" MB":Math.max(1,Math.round(b/1024))+" KB"; }
const cacheDrive={};
async function listarPasta(id){
  if(cacheDrive[id]) return cacheDrive[id];
  const q=encodeURIComponent(`'${id}' in parents and trashed=false`);
  const url=`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=folder,name_natural&pageSize=500&fields=files(id,name,mimeType,size,modifiedTime,webViewLink,shortcutDetails)&key=${encodeURIComponent(GOOGLE_API_KEY)}`;
  const r=await fetch(url); if(!r.ok) throw new Error("drive "+r.status);
  const j=await r.json(); cacheDrive[id]=j.files||[]; return cacheDrive[id];
}

      return `<div class="aula"><div class="ic" style="background:${cor}">${tx}</div>

const COLS = ["Curso","Disciplina","Professor","Turno","Link da pasta"];
const semAcento = t => String(t??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
function chaveCol(h){ const k=semAcento(h);
  if(k.startsWith("curso")) return "curso"; if(k.startsWith("disciplina")) return "nome";
  if(k.startsWith("prof")) return "professor"; if(k.startsWith("turma")||k.startsWith("turno")) return "turma";
  if(k.startsWith("link")||k.includes("pasta")||k.startsWith("url")) return "link"; return null; }
function acharCurso(txt){ const k=semAcento(txt); if(!k) return null;
  return S.cursos.find(c=>semAcento(c.nome)===k) || S.cursos.find(c=>semAcento(c.sigla)===k) || S.cursos.find(c=>semAcento(c.nome).includes(k)) || null; }

function baixarModelo(){

async function lerPlanilha(arquivo){
  try{
    const wb=XLSX.read(await arquivo.arrayBuffer(),{type:"array"});
    const aba=wb.Sheets[wb.SheetNames[0]];
    const matriz=XLSX.utils.sheet_to_json(aba,{header:1,defval:"",raw:false});
    const iCab=matriz.findIndex(l=>l.some(c=>chaveCol(c)==="nome"));
    if(iCab<0){ toast("Não encontrei a coluna \"Disciplina\" na planilha.",true); return; }
    const mapa=matriz[iCab].map(chaveCol);
    const linhas=matriz.slice(iCab+1).map((l,i)=>{ const o={_linha:iCab+i+2}; mapa.forEach((k,j)=>{ if(k) o[k]=String(l[j]??"").trim(); }); return o; })
      .filter(o=>o.nome||o.curso||o.professor||o.link);
    analisar(linhas, arquivo.name);
  }catch(e){ toast("Não consegui ler o arquivo. Salve como .xlsx ou .csv e tente de novo.",true); }
}

function analisar(linhas, nomeArq){
  const vistos=new Set();
  S._imp = linhas.map(o=>{
    const r={...o, status:"", msg:""};
    const c=acharCurso(o.curso);
    if(!o.curso){ r.status="err"; r.msg="Falta o curso"; return r; }
    if(!c){ r.status="err"; r.msg=`Curso "${o.curso}" não cadastrado`; return r; }
    if(!o.nome){ r.status="err"; r.msg="Falta a disciplina"; return r; }
    if(o.link && !urlOk(o.link)){ r.status="err"; r.msg="Link inválido (precisa começar com https://)"; return r; }
    const chave=c.id+"|"+semAcento(o.nome)+"|"+semAcento(o.turma);
    if(vistos.has(chave)){ r.status="err"; r.msg="Repetida na planilha"; return r; } vistos.add(chave);
    r.curso_id=c.id; r.cursoNome=c.nome;
    const ex=S.disc.find(d=>d.curso_id===c.id && semAcento(d.nome)===semAcento(o.nome) && semAcento(d.turma)===semAcento(o.turma));
    if(ex){ r.existente=ex;
      const muda=["professor","link"].some(k=>o[k] && o[k]!==(ex[k]||""));
      r.status=muda?"atu":"igual"; r.msg=muda?"Atualizar":"Sem mudanças"; }
    else { r.status="nova"; r.msg="Nova"; }
    return r;
  });
  const n=k=>S._imp.filter(r=>r.status===k).length;
  const rot={nova:"Nova",atu:"Atualizar",err:"Erro",igual:"Sem mudanças"};
  $("prev").innerHTML=`
    <div class="painel" style="box-shadow:none">
      <b>${esc(nomeArq)}</b> — ${S._imp.length} linha${S._imp.length===1?"":"s"}:
      <span class="st nova">${n("nova")} novas</span> <span class="st atu">${n("atu")} para atualizar</span>
      <span class="st igual">${n("igual")} sem mudanças</span> <span class="st err">${n("err")} com erro</span>
      <div class="tab-wrap" style="margin-top:12px;max-height:420px;overflow:auto"><table>
        <thead><tr><th>Linha</th><th>Situação</th><th>Curso</th><th>Disciplina</th><th>Professor</th><th>Turno</th><th>Link</th></tr></thead>
        <tbody>${S._imp.map(r=>`<tr><td class="dica">${r._linha}</td><td><span class="st ${r.status}">${esc(r.status==="err"?r.msg:rot[r.status])}</span></td>
          <td>${esc(r.cursoNome||r.curso)}</td><td><b>${esc(r.nome)}</b></td><td>${esc(r.professor)}</td><td>${esc(r.turma)}</td>
          <td class="dica" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.link?"✓ "+esc(r.link):"—"}</td></tr>`).join("")}</tbody></table></div>
      ${n("err")?`<p class="dica" style="color:#b42318">As linhas com erro serão ignoradas. Corrija na planilha e importe de novo se quiser incluí-las.</p>`:""}
      <div class="linha-acoes" style="margin-top:12px">
        ${n("nova")+n("atu")?`<button class="btn prim" id="confImp">Importar ${n("nova")+n("atu")} disciplina${n("nova")+n("atu")===1?"":"s"}</button>`:`<span class="dica">Nada para importar.</span>`}
        <button class="btn" onclick="abaImp()">Cancelar</button></div>
    </div>`;
  if($("confImp")) $("confImp").onclick=importar;
}

async function importar(){
  const b=$("confImp"); b.disabled=true; b.textContent="Importando…";
  const agora=new Date().toISOString();
  const novas=S._imp.filter(r=>r.status==="nova").map(r=>({curso_id:r.curso_id,nome:r.nome,professor:r.professor||null,turma:r.turma||null,link:r.link||null}));
  const atus=S._imp.filter(r=>r.status==="atu");
  let ok=0, falhas=0;
  if(novas.length){ const {data,error}=await sb.from("disciplinas").insert(novas).select();
    if(error){ toast("Erro ao importar: "+erroMsg(error),true); b.disabled=false; b.textContent="Tentar de novo"; return; }
    S.disc=ordenar([...S.disc,...data]); ok+=data.length; }
  for(const r of atus){
    const corpo={atualizado_em:agora}; ["professor","link"].forEach(k=>{ if(r[k]) corpo[k]=r[k]; });
    const {error}=await sb.from("disciplinas").update(corpo).eq("id",r.existente.id);
    if(error) falhas++; else { Object.assign(r.existente,corpo); ok++; }
  }
  toast(`Pronto! ${ok} disciplina${ok===1?"":"s"} importada${ok===1?"":"s"}${falhas?` · ${falhas} com erro`:""}.`, !!falhas);
  S.aba="disc"; if(atus[0]||novas[0]) S.filtroCurso=(novas[0]||atus[0]).curso_id; renderCoord();
}

/* ======================= INÍCIO ======================= */
(async()=>{
  if(configurado){
    const {data}=await sb.auth.getSession(); S.sessao=data.session;
    sb.auth.onAuthStateChange((ev,sess)=>{
      const tinha=!!S.sessao; S.sessao=sess;
      // só redesenha quando entra ou sai; ignora renovações automáticas (ao voltar para a aba)
      if((ev==="SIGNED_IN" && !tinha) || ev==="SIGNED_OUT") setTimeout(()=>{ if(S.tela==="coord") renderCoord(); },0);
    });
  }
  if(location.hash==="#coordenacao") S.tela="coord";
  await carregar();
  if(location.hash.startsWith("#d-")){ const d=S.disc.find(x=>x.id===location.hash.slice(3)); if(d){ S.tela="disc"; S.curso=d.curso_id; S.discAtual=d.id; S.pilha=[]; } }
  if(location.hash.startsWith("#c-")){ const id=location.hash.slice(3); if(cursoDe(id)){ S.tela="curso"; S.curso=id; } }
  render();
})();
</script>
